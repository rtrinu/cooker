name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The root project has no build target, so install only its locked
      # dependencies. Tests use Django's in-memory SQLite database.
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Django checks
        run: uv run --no-sync python backend/manage.py check
      - name: Migrations are committed
        run: uv run --no-sync python backend/manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run --no-sync python backend/manage.py test recipes --verbosity 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
